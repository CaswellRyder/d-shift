name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      CUDA_VISIBLE_DEVICES: '-1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install frozen desktop environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check .
      - name: Verify frozen v1 artifact bytes in current tree
        run: python3 scripts/verify_current_models.py
      - name: Generated model probes with current runtime
        run: uv run --locked python scripts/verify_current_models.py --smoke

  network:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: network/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Network race checks and static analysis
        working-directory: network
        run: |
          go test -race ./...
          go vet ./...
      - name: Dashboard control regressions
        run: node --test network/laptop/web/*.test.mjs
      - name: Firmware state and contract regressions
        run: scripts/test_manual_motors.sh
      - name: Pi Zero W build
        working-directory: network
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '6'
        run: go build -o "$RUNNER_TEMP/pi-link" ./cmd/pi-link
  esp32-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Compile XIAO ESP32-S3 motor firmware
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32S3 firmware/esp32_manual_motors
