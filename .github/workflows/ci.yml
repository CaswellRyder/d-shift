name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      CUDA_VISIBLE_DEVICES: '-1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install frozen desktop test environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check .
      - name: Python regression tests
        run: uv run --locked --extra dev pytest -q
      - name: Browser policy tests
        run: node --test tests/frame-policy.test.cjs tests/goal-view.test.cjs
      - name: Verify committed v1 artifacts
        run: python3 scripts/verify_release.py
      - name: Generated model loading checks
        run: uv run --locked python scripts/verify_release.py --smoke
